<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1f1b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Parlour</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Parlour</h1>
        <button id="settings-toggle" class="link" type="button">Settings</button>
      </header>

      <section id="settings" hidden>
        <label>Token <input id="token" type="password" autocomplete="off" placeholder="PARLOUR_TOKEN" /></label>
        <label>Room <input id="room" placeholder="kitchen" autocapitalize="none" /></label>
        <button id="save" class="link" type="button">Save</button>
      </section>

      <section class="transcript">
        <p id="heard" class="heard"></p>
        <p id="reply" class="reply">Hold the button and say something.</p>
      </section>

      <button id="talk" class="talk" type="button" aria-label="Hold to talk">
        <span id="talk-label">Hold to talk</span>
      </button>

      <p id="status" class="status"></p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
