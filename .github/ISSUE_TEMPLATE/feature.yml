name: Feature or provider request
description: Something you would like Parlour to do, or an engine or platform you would like it to support.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Good to hear from you. A quick note before you start: a new engine for an existing port (a voice, a speech to text engine, a model server, a search) can be an npm package that needs no change here at all, and https://heyparlour.app/docs/providers shows how. An issue is still very welcome if you would like one built in, or if the port you need does not exist yet.
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: The thing you cannot do today, described in terms of your house rather than the code.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: A config snippet, a command, or a sentence is plenty. If it is a provider, tell us which kind and what it would wrap.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - A provider for an existing port
        - An integration (a new source of tools)
        - A new port
        - A CLI command or flag
        - The network server or a client
        - The desktop app
        - Linux or another platform
        - Documentation
        - Something else
  - type: checkboxes
    id: willing
    attributes:
      label: Would you like to work on it
      options:
        - label: I would happily open a pull request for this, with a few pointers
