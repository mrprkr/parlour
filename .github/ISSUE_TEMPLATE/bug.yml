name: Bug report
description: Parlour did something it should not have, or did not do something it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Most problems can be pinned down from the doctor's output and the log, so please include both if you can. Never paste a token or a key: `parlour secrets status` reports which ones are set without showing their values.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you said or did, what Parlour did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: parlour doctor
      description: The whole output. If it hangs, tell us where.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The log around the problem
      description: "`parlour service logs`, the Logs tab in the app, or the terminal running `parlour start`. Setting `LOG_LEVEL=debug` in secrets.env gives a lot more detail."
      render: text
  - type: textarea
    id: config
    attributes:
      label: Config
      description: "`parlour config show`, with anything you would rather keep private removed. There should be no secrets in it."
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      description: "`parlour --version`, and the app's version if the app is involved."
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: macOS version and chip, and `node -v`.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Which client
      description: Where the request came from, if it makes a difference.
      options:
        - The server's own microphone
        - A satellite
        - Home Assistant / Voice PE
        - The phone page
        - Custom hardware on /listen
        - /ask
        - parlour text
        - The desktop app
        - Not applicable
