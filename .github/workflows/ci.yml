name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push to a branch with an open pull request runs once, not twice, and a
# newer push replaces a run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    # macOS because the package's native dependencies (onnxruntime, the wake
    # word and the voice) and the desktop app both build for it, and it is the
    # only platform the release ships for. Linux support would add a second
    # runner here, not replace this one.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.2.0

      # The pnpm version comes from packageManager in package.json, so there
      # is one place to bump it.
      - name: Set up pnpm
        uses: pnpm/action-setup@a6e2c6b7be8d3b0e7d1c2e8c5e6f7a8b9c0d1e2f # v6.0.1

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Cheap, and it stands between a typo and a tag that fails after half an
      # hour of release build: the bundler reads these three at the very end,
      # when it signs, and a missing entitlements file is only a problem then.
      - name: Check the bundle's signing configuration
        run: |
          plutil -lint apps/desktop/src-tauri/Info.plist apps/desktop/src-tauri/Entitlements.plist
          entitlements="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').bundle.macOS.entitlements")"
          if [ ! -f "apps/desktop/src-tauri/$entitlements" ]; then
            echo "tauri.conf.json names $entitlements, which is not next to it." >&2
            exit 1
          fi
          echo "Info.plist and $entitlements are both there and both parse."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable 2024-12-19

      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaff # v2.7.5
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test and build every project
        run: pnpm exec nx run-many -t typecheck lint test build

      # Tauri's generate_context! macro embeds the frontend and the app icon at
      # compile time and panics when either is missing, so this has to come
      # after the build above (which writes apps/desktop/dist) and after the
      # icons, which are generated from src-tauri/icon.png and not checked in.
      - name: Generate the app icons
        run: pnpm -C apps/desktop icons

      - name: Check the Rust side compiles
        run: pnpm exec nx run desktop:cargo-check

  bundle:
    name: Build the app bundle
    # Not on pull requests. A release build with lto on takes long enough that
    # running it per push would cost more than it catches, and cargo-check
    # above already covers the Rust. On main it is the release path rehearsed
    # without the signing, so a tag is not the first time the bundler runs.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.2.0

      - name: Set up pnpm
        uses: pnpm/action-setup@a6e2c6b7be8d3b0e7d1c2e8c5e6f7a8b9c0d1e2f # v6.0.1

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable 2024-12-19

      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaff # v2.7.5
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same one step the release runs: icons, frontend, binary, .app, dmg.
      # No Apple variables here, so it signs nothing, which is the point: the
      # bundle has to build without a certificate as well as with one.
      - name: Build the app
        run: pnpm -C apps/desktop build

      # With no credentials this notarises nothing and says so. It runs anyway,
      # because finding exactly one dmg where the release expects one is worth
      # knowing before a tag, and because the script is easier to break than
      # it looks.
      - name: Check the release would find the dmg
        run: scripts/notarise.sh
