name: Release

# Tag a commit vX.Y.Z (the merge of the "Release the pending changesets" pull
# request, or a commit after `pnpm version:set X.Y.Z`) and push the tag. That
# publishes the parlour package to npm, and nothing else: the Mac app is
# released on GitHub by desktop-release.yml when its version moves on main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish parlour to npm
    # macOS, because the package's tests assume launchd and avfoundation, as CI does.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Provenance: npm records which workflow and commit built the tarball,
      # and the OIDC token is how it proves that.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag that does not match the version in package.json publishes the
      # wrong thing under the right name, which npm will not let anyone undo.
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/parlour/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match packages/parlour/package.json ($version)." >&2
            echo "Run pnpm version:set $tag, commit, and tag that commit." >&2
            exit 1
          fi

      - name: Test
        run: pnpm -C packages/parlour test

      - name: Build
        run: pnpm -C packages/parlour build

      # Trusted publishing: npm trusts this workflow through the OIDC token
      # above, so there is no NPM_TOKEN to rotate or leak. The package's
      # settings on npmjs.com name this repository and this file as its
      # trusted publisher. npm 11.5.1 or later is needed for it.
      - name: Publish
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public
        working-directory: packages/parlour
