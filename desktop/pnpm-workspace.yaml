# Not a workspace, a fence. Without this pnpm walks up, finds
# agent/pnpm-workspace.yaml and treats the agent as the root, so installing
# here quietly installs the agent's dependencies into agent/node_modules and
# leaves this directory with no tauri CLI at all.
packages: []

# The frontend toolchain's native halves. pnpm blocks install scripts unless
# they are named, and refuses the whole install if it had to block any.
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
